[project]
name = "module-12-mcp-protocol"
version = "0.1.0"
description = "MCP Protocol lab — build an MCP server with Tools, Resources, and Prompts"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
mcp-server = "src.mcp_server:main"
test-client = "src.test_mcp_client:main"

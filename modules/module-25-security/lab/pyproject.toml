[project]
name = "module-25-security"
version = "0.1.0"
description = "Security and trust lab — prompt injection, PII, STRIDE, red-teaming"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "google-auth>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
security = "src.security_lab:main"

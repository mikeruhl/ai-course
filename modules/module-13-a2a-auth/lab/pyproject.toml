[project]
name = "module-13-a2a-auth"
version = "0.1.0"
description = "A2A Authentication lab — Managed Identity, OAuth 2.0 client credentials, JWT validation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pyjwt>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
auth-demo = "src.auth_demo:main"
token-validator = "src.token_validator:main"

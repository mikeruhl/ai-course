[project]
name = "module-23-durable-execution"
version = "0.1.0"
description = "Durable execution lab — event sourcing, checkpoints, saga pattern"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "google-auth>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
durable = "src.durable_patterns:main"

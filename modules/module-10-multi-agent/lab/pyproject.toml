[project]
name = "module-10-multi-agent"
version = "0.1.0"
description = "Multi-agent architectures lab — orchestrator-subagent, handoff, peer debate"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
orchestrator = "src.orchestrator_subagent:main"
handoff = "src.handoff_chain:main"
debate = "src.peer_debate:main"
cards = "src.agent_cards:main"
circuit = "src.circuit_breaker:main"

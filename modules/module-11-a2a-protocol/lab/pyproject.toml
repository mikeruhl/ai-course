[project]
name = "module-11-a2a-protocol"
version = "0.1.0"
description = "A2A Protocol lab — server, client, streaming, two-agent delegation, discovery"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
server = "src.a2a_server:start"
client = "src.a2a_client:main"
planner = "src.planner_agent:start"
researcher = "src.researcher_agent:start"
discovery = "src.dynamic_discovery:main"

[project]
name = "module-24-cost-performance"
version = "0.1.0"
description = "Cost and performance lab — token economics, caching, profiling"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
costperf = "src.cost_performance:main"

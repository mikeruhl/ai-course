[project]
name = "module-15-mcp-hosting"
version = "0.1.0"
description = "Lab: MCP Server Hosting on Azure Container Apps"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "tiktoken>=0.7",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "rich>=13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

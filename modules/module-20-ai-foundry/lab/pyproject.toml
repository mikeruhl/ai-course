[project]
name = "module-20-ai-foundry"
version = "0.1.0"
description = "Azure AI Foundry Agent Service lab — managed agents, threads, runs, multi-agent handoff"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
foundry = "src.foundry_agent:main"

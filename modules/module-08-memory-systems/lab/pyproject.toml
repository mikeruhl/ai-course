[project]
name = "module-08-memory-systems"
version = "0.1.0"
description = "Memory systems lab — in-context, episodic, semantic (Azure AI Search), procedural"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "google-auth>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
memory = "src.memory_systems:main"

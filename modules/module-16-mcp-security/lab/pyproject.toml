[project]
name = "module-16-mcp-security"
version = "0.1.0"
description = "MCP Security lab — injection hardening, auth, rate limiting, output sanitization"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "google-auth>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
security-audit = "src.security_audit:main"
injection-demo = "src.injection_demo:main"

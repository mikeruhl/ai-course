[project]
name = "module-09-rag"
version = "0.1.0"
description = "RAG lab — chunking, embedding, hybrid retrieval, reranking, RAGAS evaluation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
rag = "src.rag_pipeline:main"
